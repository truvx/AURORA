name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # JDK 17 per docs/ADR-016-VERSION-MATRIX.md.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 is newer than the runner image ships with.
      - name: Install required SDK packages
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Assemble
        run: ./gradlew :app:assembleDebug --no-daemon

      # The live AI gateway test stays skipped here; it needs a running server and
      # provider credentials. Run it locally with -PauroraLiveAi=true.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 24 LTS per docs/ADR-016-VERSION-MATRIX.md.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Builds without provider credentials: keys are read at request time, not build
      # time, and no client bundle may contain them.
      - name: Build
        run: npm run build
