name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The YouTube Data API key is injected from local.properties at build time, which is
  # gitignored - so the key reaches the APK without reaching the repository. Nothing
  # enforced that until now. This fails the build if a credential is committed, because
  # the alternative is finding out from Google's scanner after it has been revoked.
  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for credentials
        run: |
          set -uo pipefail
          # Google API keys, OAuth client secrets, private key blocks.
          PATTERN='AIza[0-9A-Za-z_-]{35}|GOCSPX-[0-9A-Za-z_-]+|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          # Only what AURORA ships. Vendored tooling elsewhere in the tree carries its own
          # test fixtures - a secret *detector* has fake keys in its tests by necessity -
          # and failing this build on someone else's fixture teaches people to ignore it.
          HITS=$(git ls-files -z -- android web docs .github '*.md' '*.json' \
                 | xargs -0 grep -nIE "$PATTERN" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::A credential is committed. Revoke it first, then remove it from history."
            exit 1
          fi
          echo "No credentials in anything AURORA ships."

      - name: local.properties must stay untracked
        run: |
          if git ls-files --error-unmatch android/local.properties 2>/dev/null; then
            echo "::error::android/local.properties is tracked. It holds the signing password and the API key."
            exit 1
          fi
          echo "local.properties is untracked."

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      # JDK 17 per docs/ADR-016-VERSION-MATRIX.md.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action installs the legacy "tools" package by default, which Google has removed
      # from the SDK repository - sdkmanager now fails with "Failed to find package 'tools'".
      # The packages this build actually needs are installed explicitly below.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # compileSdk 37 is newer than the runner image ships with. Android 17 uses the
      # versioned API scheme, so the package is android-37.0 rather than android-37.
      - name: Install required SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - name: Assemble
        run: ./gradlew :app:assembleDebug --no-daemon

      # The live AI gateway test stays skipped here; it needs a running server and
      # provider credentials. Run it locally with -PauroraLiveAi=true.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      # R8 strips anything it cannot see referenced, and the failures only appear at
      # runtime. Building the minified release on every change catches a broken keep rule
      # here rather than in an installed build.
      - name: Release build (R8)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Node 24 LTS per docs/ADR-016-VERSION-MATRIX.md.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Builds without provider credentials: keys are read at request time, not build
      # time, and no client bundle may contain them.
      - name: Build
        run: npm run build

      # Only the browser the smoke suite uses; installing all three triples the download.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Catches what unit tests structurally cannot: hydration, routing, keyboard
      # reachability, and accessible names in a real browser.
      - name: End-to-end smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
